plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jsoperation.bboshacam'
    compileSdk 34

    defaultConfig {
        applicationId 'com.jsoperation.bboshacam'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'wasm', 'task'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
