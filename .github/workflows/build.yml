name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download face model
        run: |
          curl -fL -o app/src/main/assets/web/face_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task

      - name: Build
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BboshaCam.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BboshaCam
          path: BboshaCam.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 뽀샤캠 최신 버전
          body: 휴대폰에서 BboshaCam.apk 를 눌러 설치하세요. (빌드 ${{ github.run_number }})
          files: BboshaCam.apk
          make_latest: true
          prerelease: false
